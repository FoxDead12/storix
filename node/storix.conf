server {

  listen 443 ssl; # managed by Certbot
  server_name storix.dx3.online www.storix.dx3.online;

  root /var/www/html/storix/;
  ssl_certificate /etc/letsencrypt/live/storix.dx3.online/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/storix.dx3.online/privkey.pem; # managed by Certbot

  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

  # ... config to broker ...
  location /api/ {
    proxy_pass http://localhost:6001/storix/;

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 1m;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
  }

  # ... config to brook upload, buffers body to disk and passes the path in X-File-Path ...
  location /api/upload {
    client_max_body_size 10G;
    client_body_temp_path /tmp/brook_uploads 1 2;
    client_body_in_file_only on;
    client_body_buffer_size 128k;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-File-Path $request_body_file;

    proxy_connect_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_pass http://localhost:6001/storix/upload;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
  }

  # ... served only via X-Accel-Redirect from the storix-download job, never directly by clients ...
  location /internal/uploads/ {
    internal;
    alias /mnt/hdd/storix/;
  }

  location /fs/ {
    proxy_pass http://localhost:12003/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
  }

  location /login {
    try_files /login.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }


}

server {
  listen       80;
  server_name  storix.dx3.online;
  return 301 https://$host$request_uri;
}
